<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Inventario Panineria da Andrea</title>
<meta name="description" content="Inventario settimanale della Panineria da Andrea, per categorie, con generazione automatica del messaggio per WhatsApp." />
<meta name="theme-color" content="#24664f" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1 class="brand">Panineria da Andrea<strong>Inventario</strong></h1>
        <p class="brand-sub" id="dateLabel"></p>
      </div>
      <button id="editToggle" class="icon-btn edit-toggle" aria-pressed="false" aria-label="Modifica lista" title="Modifica lista">✏️</button>
    </div>
    <div class="dept-switch" role="group" aria-label="Reparto">
      <button class="dept-tab" data-dept="cucina" aria-pressed="false">👨‍🍳 Cucina</button>
      <button class="dept-tab" data-dept="cassieri" aria-pressed="false">💰 Cassieri</button>
    </div>
    <div class="search-row">
      <span class="search-icon">🔍</span>
      <input id="searchInput" aria-label="Cerca ingrediente o categoria" type="search" inputmode="search" autocomplete="off" placeholder="Cerca ingrediente o categoria…" />
      <button id="searchClear" class="search-clear" hidden aria-label="Cancella ricerca">✕</button>
    </div>
    <div class="progress-row">
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <span id="progressLabel" class="progress-label">0/0</span>
    </div>
    <div class="backup-row">
      <button id="exportBtn" class="backup-btn">💾 Esporta lista</button>
      <button id="importBtn" class="backup-btn">📂 Importa lista</button>
      <input type="file" id="importFileInput" accept="application/json" />
    </div>
    <div class="backup-row">
      <button id="resetBtn" class="backup-btn danger-btn" title="Svuota tutti i valori per iniziare una nuova settimana">↺ Svuota inventario (nuova settimana)</button>
    </div>
  </header>

  <main id="categoryList" class="category-list"></main>

  <div class="add-category-row">
    <input id="newCategoryInput" type="text" placeholder="Nuova categoria (es. Bevande)" />
    <button id="addCategoryBtn">+ Categoria</button>
  </div>

  <footer class="bottombar">
    <button id="generateBtn" class="primary-btn">Genera messaggio</button>
  </footer>
</div>

<div id="modalOverlay" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle">Messaggio pronto</h2>
      <button id="modalClose" class="icon-btn" aria-label="Chiudi">✕</button>
    </div>
    <pre id="messagePreview" class="message-preview"></pre>
    <div class="modal-actions">
      <button id="copyBtn" class="ghost-btn" style="flex:1; padding:14px;">📋 Copia</button>
      <button id="whatsappBtn" class="whatsapp-btn">Apri in WhatsApp</button>
    </div>
    <p id="copyFeedback" class="copy-feedback" aria-live="polite"></p>
  </div>
</div>

<script src="icons.js"></script>
<script>
(function () {
  "use strict";

  var icon = window.inventoryIcon;
  var collapsedCategories = new Set();
  var DEPTS = ["cucina", "cassieri"];
  var DEPT_LABELS = { cucina: "Cucina", cassieri: "Cassieri" };
  var POLL_MS = 5000;
  var SAVE_DEBOUNCE_MS = 700;

  function storageKeyFor(dept) { return "checkScorte_v1_" + dept; }
  function apiUrlFor(dept) { return "/api/inventory?dept=" + encodeURIComponent(dept); }

  function getDeptFromUrl() {
    try {
      var d = new URLSearchParams(location.search).get("dept");
      if (DEPTS.indexOf(d) !== -1) return d;
    } catch (e) { /* ignore */ }
    return DEPTS[0];
  }

  var currentDept = getDeptFromUrl();
  var searchQuery = "";
  var lastKnownUpdatedAt = 0;
  var saveTimer = null;
  var isDirty = false;
  var isSaving = false;

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function defaultState(dept) {
    if (dept === "cassieri") {
      return { categories: [] };
    }
    return {
      categories: [
        { id: uid(), name: "Pane e Patatine", items: [] },
        { id: uid(), name: "Carne", items: [] },
        { id: uid(), name: "Latticini", items: [] },
        { id: uid(), name: "Surgelati", items: [] },
        { id: uid(), name: "Olio e spezie", items: [] },
        { id: uid(), name: "Salse", items: [] },
        { id: uid(), name: "Pizzeria", items: [] }
      ]
    };
  }

  function loadLocalCache(dept) {
    try {
      var raw = localStorage.getItem(storageKeyFor(dept));
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.categories)) return parsed;
      }
    } catch (e) { /* storage unavailable or corrupt */ }
    return null;
  }

  function saveLocalCache() {
    try { localStorage.setItem(storageKeyFor(currentDept), JSON.stringify(state)); } catch (e) { /* best effort */ }
  }

  var state = loadLocalCache(currentDept) || defaultState(currentDept);

  var app = document.getElementById("app");
  var categoryList = document.getElementById("categoryList");
  var editToggle = document.getElementById("editToggle");
  var progressFill = document.getElementById("progressFill");
  var progressLabel = document.getElementById("progressLabel");
  var dateLabel = document.getElementById("dateLabel");
  var searchInput = document.getElementById("searchInput");
  var searchClear = document.getElementById("searchClear");

  editToggle.innerHTML = icon("edit") + '<span>Modifica</span>';
  document.querySelector('.search-icon').innerHTML = icon('search');
  document.querySelector('[data-dept="cucina"]').innerHTML = icon('chef') + 'Cucina';
  document.querySelector('[data-dept="cassieri"]').innerHTML = icon('receipt') + 'Cassieri';
  document.getElementById('generateBtn').innerHTML = icon('message') + 'Genera messaggio';
  document.getElementById('modalClose').innerHTML = icon('close');
  document.getElementById('copyBtn').textContent = 'Copia testo';
  document.getElementById('exportBtn').textContent = 'Esporta lista';
  document.getElementById('importBtn').textContent = 'Importa lista';

  function todayLabel() {
    var d = new Date();
    var s = d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  dateLabel.textContent = todayLabel();

  function isFilled(v) { return v && v.trim().length > 0; }
  function isFinito(v) { return isFilled(v) && v.trim().toLowerCase().indexOf("finit") === 0; }

  function computeProgress() {
    var total = 0, filled = 0;
    state.categories.forEach(function (c) {
      c.items.forEach(function (it) {
        total++;
        if (isFilled(it.value)) filled++;
      });
    });
    return { filled: filled, total: total };
  }

  function updateProgressUI() {
    var p = computeProgress();
    progressLabel.textContent = p.filled + "/" + p.total + " compilati";
    progressFill.style.width = p.total ? Math.round((p.filled / p.total) * 100) + "%" : "0%";
  }

  function rowClass(value) {
    if (!isFilled(value)) return "";
    if (isFinito(value)) return "row-warn";
    return "row-ok";
  }

  function renderCategory(cat, idx, catsTotal) {
    var filled = cat.items.filter(function (it) { return isFilled(it.value); }).length;
    var total = cat.items.length;
    var countClass = total > 0 && filled === total ? "all-done" : "";

    var visibleItems = (searchQuery && !matchesSearch(cat.name))
      ? cat.items.filter(function (it) { return matchesSearch(it.name); })
      : cat.items;

    var itemsHtml = visibleItems.map(function (it) {
      var cls = rowClass(it.value);
      var finitoActive = isFinito(it.value) ? "active" : "";
      return (
        '<div class="item-row ' + cls + '" data-item-row="' + it.id + '">' +
          '<button class="drag-handle item-drag-handle" aria-label="Trascina per riordinare" tabindex="-1">☰</button>' +
          '<span class="ingredient-icon">' + icon(it.name, cat.name) + '</span>' +
          '<div class="item-name">' + esc(it.name) + "</div>" +
          '<input class="item-input" type="text" inputmode="text" autocomplete="off" ' +
            'aria-label="Quantità di ' + esc(it.name) + '" placeholder="Es. 2 kg, 1 cassa" value="' + esc(it.value || "") + '" ' +
            'data-action="input-value" data-item-id="' + it.id + '" data-cat-id="' + cat.id + '" />' +
          '<button aria-pressed="' + isFinito(it.value) + '" aria-label="Segna ' + esc(it.name) + ' come finito" class="chip-finito ' + finitoActive + '" data-action="toggle-finito" ' +
            'data-item-id="' + it.id + '" data-cat-id="' + cat.id + '">Finito</button>' +
          '<button class="icon-btn item-delete" data-action="delete-item" ' +
            'data-item-id="' + it.id + '" data-cat-id="' + cat.id + '" aria-label="Elimina">✕</button>' +
        "</div>"
      );
    }).join("");

    if (total === 0) {
      itemsHtml = '<p class="empty-hint">Nessun ingrediente. Usa Modifica per aggiungerne uno.</p>';
    }

    return (
      '<section class="category-card' + (collapsedCategories.has(cat.id) && !searchQuery ? ' collapsed' : '') + '" data-cat-id="' + cat.id + '">' +
        '<div class="category-header">' +
          '<button class="drag-handle cat-drag-handle" aria-label="Trascina per riordinare" tabindex="-1">☰</button>' +
          '<button aria-expanded="' + (!collapsedCategories.has(cat.id) || !!searchQuery) + '" class="category-toggle" data-action="toggle-collapse" data-cat-id="' + cat.id + '">' +
            '<span class="category-icon">' + icon(cat.name) + '</span>' +
            '<span class="chevron">' + icon('chevron') + '</span>' +
            '<span class="category-name">' + esc(cat.name) + "</span>" +
          "</button>" +
          '<span class="category-count ' + countClass + '">' + filled + "/" + total + "</span>" +
          '<button class="icon-btn reorder-btn" data-action="move-cat-up" data-cat-id="' + cat.id + '" ' +
            'aria-label="Sposta categoria su"' + (idx === 0 ? " disabled" : "") + ">▲</button>" +
          '<button class="icon-btn reorder-btn" data-action="move-cat-down" data-cat-id="' + cat.id + '" ' +
            'aria-label="Sposta categoria giù"' + (idx === catsTotal - 1 ? " disabled" : "") + ">▼</button>" +
          '<button class="icon-btn category-delete" data-action="delete-category" ' +
            'data-cat-id="' + cat.id + '" aria-label="Elimina categoria">✕</button>' +
        "</div>" +
        '<div class="category-body">' +
          itemsHtml +
          '<div class="add-item-row">' +
            '<input type="text" placeholder="Nuovo ingrediente" data-new-item-for="' + cat.id + '" />' +
            '<button data-action="add-item" data-cat-id="' + cat.id + '">+ Aggiungi</button>' +
          "</div>" +
        "</div>" +
      "</section>"
    );
  }

  function normalizeText(s) {
    return String(s || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(new RegExp("[\\u0300-\\u036f]", "g"), "");
  }

  function matchesSearch(text) {
    if (!searchQuery) return true;
    return normalizeText(text).indexOf(searchQuery) !== -1;
  }

  function categoryMatchesSearch(cat) {
    if (!searchQuery) return true;
    if (matchesSearch(cat.name)) return true;
    return cat.items.some(function (it) { return matchesSearch(it.name); });
  }

  function render() {
    var cats = state.categories;
    if (cats.length === 0) {
      categoryList.innerHTML = '<p class="empty-state">Nessuna categoria. Tocca Modifica e aggiungine una per iniziare.</p>';
    } else if (searchQuery && !cats.some(categoryMatchesSearch)) {
      categoryList.innerHTML = '<p class="empty-state">Nessun risultato per «' + esc(searchInput.value.trim()) + '».</p>';
    } else {
      categoryList.innerHTML = cats.map(function (cat, idx) {
        if (searchQuery && !categoryMatchesSearch(cat)) return "";
        return renderCategory(cat, idx, cats.length);
      }).join("");
    }
    updateProgressUI();
  }

  // ---- Sync with shared server storage, so every device sees the same list ----
  function isTypingInList() {
    var el = document.activeElement;
    return !!(el && el.matches && el.matches(".item-input, [data-new-item-for], #newCategoryInput"));
  }

  function persist() {
    saveLocalCache();
    isDirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(pushToServer, SAVE_DEBOUNCE_MS);
  }

  function pushToServer() {
    var dept = currentDept;
    isDirty = false;
    isSaving = true;
    fetch(apiUrlFor(dept), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state: state })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        isSaving = false;
        if (dept === currentDept && data && data.updatedAt) lastKnownUpdatedAt = data.updatedAt;
      })
      .catch(function () { isSaving = false; });
  }

  function pollFromServer() {
    if (isDirty || isSaving || isTypingInList()) return;
    var dept = currentDept;
    fetch(apiUrlFor(dept))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (dept !== currentDept) return; // user switched tab while this was in flight
        if (data && data.state && data.updatedAt > lastKnownUpdatedAt) {
          state = data.state;
          lastKnownUpdatedAt = data.updatedAt;
          saveLocalCache();
          render();
        }
      })
      .catch(function () { /* offline: keep working on the local copy */ });
  }

  function loadDeptData() {
    var dept = currentDept;
    state = loadLocalCache(dept) || defaultState(dept);
    lastKnownUpdatedAt = 0;
    render();
    fetch(apiUrlFor(dept))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (dept !== currentDept) return; // user switched tab again before this returned
        if (data && data.state) {
          state = data.state;
          lastKnownUpdatedAt = data.updatedAt || 0;
          saveLocalCache();
          render();
        } else {
          pushToServer();
        }
      })
      .catch(function () { /* offline: keep showing the local cache already rendered */ });
  }

  function updateDeptTabsUI() {
    document.querySelectorAll(".dept-tab").forEach(function (tab) {
      var selected = tab.getAttribute("data-dept") === currentDept;
      tab.classList.toggle("active", selected);
      tab.setAttribute("aria-pressed", selected);
    });
  }

  function switchDept(dept) {
    if (dept === currentDept || DEPTS.indexOf(dept) === -1) return;
    clearTimeout(saveTimer);
    if (isDirty) pushToServer(); // flush pending changes to the department we're leaving
    modalOverlay.hidden = true;
    searchInput.value = "";
    searchQuery = "";
    searchClear.hidden = true;
    app.classList.remove("edit-mode");
    editToggle.classList.remove("active");
    editToggle.innerHTML = icon("edit") + '<span>Modifica</span>';
    editToggle.setAttribute("aria-pressed", "false");
    editToggle.setAttribute("aria-label", "Modifica lista");
    editToggle.title = "Modifica lista";
    currentDept = dept;
    history.replaceState(null, "", "?dept=" + dept);
    updateDeptTabsUI();
    loadDeptData();
  }

  document.querySelectorAll(".dept-tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      switchDept(tab.getAttribute("data-dept"));
    });
  });

  // ---- Live search (filters as you type, no button to press) ----
  searchInput.addEventListener("input", function () {
    searchQuery = normalizeText(searchInput.value.trim());
    searchClear.hidden = !searchInput.value;
    render();
  });
  searchClear.addEventListener("click", function () {
    searchInput.value = "";
    searchQuery = "";
    searchClear.hidden = true;
    render();
    searchInput.focus();
  });
  updateDeptTabsUI();
  history.replaceState(null, "", "?dept=" + currentDept);

  loadDeptData();
  setInterval(pollFromServer, POLL_MS);

  // ---- Edit mode ----
  editToggle.addEventListener("click", function () {
    var editing = app.classList.toggle("edit-mode");
    editToggle.classList.toggle("active", editing);
    editToggle.innerHTML = icon(editing ? "check" : "edit") + '<span>' + (editing ? 'Fatto' : 'Modifica') + '</span>';
    editToggle.setAttribute("aria-pressed", editing);
    editToggle.setAttribute("aria-label", editing ? "Termina modifica" : "Modifica lista");
    editToggle.title = editing ? "Fatto" : "Modifica lista";
  });

  // ---- Delegated events on category list ----
  categoryList.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.getAttribute("data-action");

    if (action === "toggle-collapse") {
      var card = btn.closest(".category-card");
      var collapsed = card.classList.toggle("collapsed");
      var id = card.getAttribute("data-cat-id");
      if (collapsed) collapsedCategories.add(id); else collapsedCategories.delete(id);
      btn.setAttribute("aria-expanded", !collapsed);
      return;
    }

    if (action === "delete-category") {
      var catId = btn.getAttribute("data-cat-id");
      var cat = state.categories.find(function (c) { return c.id === catId; });
      if (cat && confirm('Eliminare la categoria "' + cat.name + '" e tutti i suoi ingredienti?')) {
        state.categories = state.categories.filter(function (c) { return c.id !== catId; });
        persist();
        render();
      }
      return;
    }

    if (action === "delete-item") {
      var itCatId = btn.getAttribute("data-cat-id");
      var itemId = btn.getAttribute("data-item-id");
      var owner = state.categories.find(function (c) { return c.id === itCatId; });
      if (owner) {
        var item = owner.items.find(function (i) { return i.id === itemId; });
        if (item && confirm('Eliminare "' + item.name + '"?')) {
          owner.items = owner.items.filter(function (i) { return i.id !== itemId; });
          persist();
          render();
        }
      }
      return;
    }

    if (action === "toggle-finito") {
      var fCatId = btn.getAttribute("data-cat-id");
      var fItemId = btn.getAttribute("data-item-id");
      var fCat = state.categories.find(function (c) { return c.id === fCatId; });
      var fItem = fCat && fCat.items.find(function (i) { return i.id === fItemId; });
      if (fItem) {
        fItem.value = isFinito(fItem.value) ? "" : "Finito";
        persist();
        var row = categoryList.querySelector('[data-item-row="' + fItemId + '"]');
        var input = row.querySelector(".item-input");
        input.value = fItem.value;
        row.className = "item-row " + rowClass(fItem.value);
        btn.classList.toggle("active", isFinito(fItem.value));
        btn.setAttribute("aria-pressed", isFinito(fItem.value));
        refreshCategoryCount(fCatId);
        updateProgressUI();
      }
      return;
    }

    if (action === "move-cat-up" || action === "move-cat-down") {
      moveCategory(btn.getAttribute("data-cat-id"), action === "move-cat-up" ? -1 : 1);
      return;
    }

    if (action === "add-item") {
      var aCatId = btn.getAttribute("data-cat-id");
      var input = categoryList.querySelector('[data-new-item-for="' + aCatId + '"]');
      var name = input.value.trim();
      if (!name) { input.focus(); return; }
      var aCat = state.categories.find(function (c) { return c.id === aCatId; });
      aCat.items.push({ id: uid(), name: name, value: "" });
      persist();
      render();
    }
  });

  categoryList.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.matches("[data-new-item-for]")) {
      e.preventDefault();
      var catId = e.target.getAttribute("data-new-item-for");
      categoryList.querySelector('[data-action="add-item"][data-cat-id="' + catId + '"]').click();
    }
  });

  categoryList.addEventListener("input", function (e) {
    if (!e.target.matches('[data-action="input-value"]')) return;
    var catId = e.target.getAttribute("data-cat-id");
    var itemId = e.target.getAttribute("data-item-id");
    var cat = state.categories.find(function (c) { return c.id === catId; });
    var item = cat && cat.items.find(function (i) { return i.id === itemId; });
    if (!item) return;
    item.value = e.target.value;
    persist();
    var row = e.target.closest(".item-row");
    row.className = "item-row " + rowClass(item.value);
    var chip = row.querySelector(".chip-finito");
    chip.classList.toggle("active", isFinito(item.value));
    chip.setAttribute("aria-pressed", isFinito(item.value));
    refreshCategoryCount(catId);
    updateProgressUI();
  });

  function refreshCategoryCount(catId) {
    var cat = state.categories.find(function (c) { return c.id === catId; });
    if (!cat) return;
    var filled = cat.items.filter(function (it) { return isFilled(it.value); }).length;
    var total = cat.items.length;
    var badge = categoryList.querySelector('.category-card[data-cat-id="' + catId + '"] .category-count');
    if (badge) {
      badge.textContent = filled + "/" + total;
      badge.classList.toggle("all-done", total > 0 && filled === total);
    }
  }

  function moveCategory(catId, dir) {
    var idx = state.categories.findIndex(function (c) { return c.id === catId; });
    if (idx === -1) return;
    var newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= state.categories.length) return;
    var tmp = state.categories[idx];
    state.categories[idx] = state.categories[newIdx];
    state.categories[newIdx] = tmp;
    persist();
    render();
  }

  // ---- Drag to reorder (categories, and ingredients within their category) ----
  function startReorderDrag(e, el, container, itemSelector, endAnchorEl, onDrop) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    var pointerId = e.pointerId;
    var rect = el.getBoundingClientRect();
    var startPointerY = e.clientY;
    var startTop = rect.top;

    var placeholder = document.createElement(el.tagName);
    placeholder.className = "drag-placeholder";
    placeholder.style.height = rect.height + "px";
    container.insertBefore(placeholder, el);

    el.style.position = "fixed";
    el.style.left = rect.left + "px";
    el.style.top = rect.top + "px";
    el.style.width = rect.width + "px";
    el.style.zIndex = "200";
    el.classList.add("dragging");
    document.body.classList.add("no-select");

    try { el.setPointerCapture(pointerId); } catch (err) { /* not critical */ }

    function onMove(ev) {
      if (ev.pointerId !== pointerId) return;
      el.style.top = (startTop + (ev.clientY - startPointerY)) + "px";

      var siblings = Array.prototype.filter.call(container.children, function (c) {
        return c !== el && c !== placeholder && c.matches(itemSelector);
      });
      var placed = false;
      for (var i = 0; i < siblings.length; i++) {
        var r = siblings[i].getBoundingClientRect();
        if (ev.clientY < r.top + r.height / 2) {
          container.insertBefore(placeholder, siblings[i]);
          placed = true;
          break;
        }
      }
      if (!placed) container.insertBefore(placeholder, endAnchorEl || null);
    }

    function onUp(ev) {
      if (ev.pointerId !== pointerId) return;
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      container.replaceChild(el, placeholder);
      el.style.position = "";
      el.style.left = "";
      el.style.top = "";
      el.style.width = "";
      el.style.zIndex = "";
      el.classList.remove("dragging");
      document.body.classList.remove("no-select");
      onDrop();
    }

    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  }

  categoryList.addEventListener("pointerdown", function (e) {
    var catHandle = e.target.closest(".cat-drag-handle");
    if (catHandle) {
      var card = catHandle.closest(".category-card");
      startReorderDrag(e, card, categoryList, ".category-card", null, function () {
        var newOrder = Array.prototype.map.call(
          categoryList.querySelectorAll(".category-card"),
          function (c) { return c.getAttribute("data-cat-id"); }
        );
        state.categories.sort(function (a, b) { return newOrder.indexOf(a.id) - newOrder.indexOf(b.id); });
        persist();
      });
      return;
    }

    var itemHandle = e.target.closest(".item-drag-handle");
    if (itemHandle) {
      var row = itemHandle.closest(".item-row");
      var body = itemHandle.closest(".category-body");
      var catId = row.closest(".category-card").getAttribute("data-cat-id");
      var endAnchor = body.querySelector(".add-item-row");
      startReorderDrag(e, row, body, ".item-row", endAnchor, function () {
        var cat = state.categories.find(function (c) { return c.id === catId; });
        if (!cat) return;
        var newOrder = Array.prototype.map.call(
          body.querySelectorAll(".item-row"),
          function (r) { return r.getAttribute("data-item-row"); }
        );
        cat.items.sort(function (a, b) { return newOrder.indexOf(a.id) - newOrder.indexOf(b.id); });
        persist();
      });
    }
  });

  // ---- Add category ----
  var newCategoryInput = document.getElementById("newCategoryInput");
  var addCategoryBtn = document.getElementById("addCategoryBtn");
  function addCategory() {
    var name = newCategoryInput.value.trim();
    if (!name) { newCategoryInput.focus(); return; }
    state.categories.push({ id: uid(), name: name, items: [] });
    newCategoryInput.value = "";
    persist();
    render();
  }
  addCategoryBtn.addEventListener("click", addCategory);
  newCategoryInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addCategory(); }
  });

  // ---- Reset for new week (tucked inside "Modifica" so it can't be tapped by accident) ----
  document.getElementById("resetBtn").addEventListener("click", function () {
    var p = computeProgress();
    if (p.total === 0) return;
    if (confirm("Svuotare tutti i valori per iniziare l'inventario di questa settimana? La lista di prodotti resta, per tutti i dispositivi.")) {
      state.categories.forEach(function (c) { c.items.forEach(function (it) { it.value = ""; }); });
      persist();
      render();
    }
  });

  // ---- Message generation ----
  function buildMessage() {
    var lines = ["📋 Inventario " + DEPT_LABELS[currentDept] + " – " + todayLabel(), ""];
    state.categories.forEach(function (cat) {
      var filledItems = cat.items.filter(function (it) { return isFilled(it.value); });
      if (filledItems.length === 0) return;
      lines.push("*" + cat.name.toUpperCase() + "*");
      filledItems.forEach(function (it) {
        lines.push("- " + it.name + ": " + it.value.trim());
      });
      lines.push("");
    });
    return lines.join("\n").trim();
  }

  var modalOverlay = document.getElementById("modalOverlay");
  var messagePreview = document.getElementById("messagePreview");
  var copyFeedback = document.getElementById("copyFeedback");

  document.getElementById("generateBtn").addEventListener("click", function () {
    var p = computeProgress();
    if (p.total === 0) {
      alert("Aggiungi prima almeno un ingrediente (tocca Modifica per modificare la lista).");
      return;
    }
    messagePreview.textContent = buildMessage();
    copyFeedback.textContent = "";
    modalOverlay.hidden = false;
    document.getElementById("modalClose").focus();
  });

  function closeModal() { modalOverlay.hidden = true; document.getElementById("generateBtn").focus(); }
  modalOverlay.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeModal();
    if (e.key !== "Tab") return;
    var buttons = modalOverlay.querySelectorAll("button");
    var first = buttons[0], last = buttons[buttons.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  document.getElementById("modalClose").addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", function (e) {
    if (e.target === modalOverlay) closeModal();
  });

  document.getElementById("copyBtn").addEventListener("click", function () {
    var text = messagePreview.textContent;
    function ok() { copyFeedback.textContent = "Copiato ✓ — incollalo su WhatsApp"; }
    function fail() {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        ok();
      } catch (err) {
        copyFeedback.textContent = "Copia non riuscita: seleziona il testo manualmente.";
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, fail);
    } else {
      fail();
    }
  });

  document.getElementById("whatsappBtn").addEventListener("click", function () {
    var text = messagePreview.textContent;
    window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
  });

  // ---- Backup: export / import (safety net if the shared storage is ever unreachable) ----
  document.getElementById("exportBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "inventario-panineria-lista-" + currentDept + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  var importFileInput = document.getElementById("importFileInput");
  document.getElementById("importBtn").addEventListener("click", function () {
    importFileInput.click();
  });
  importFileInput.addEventListener("change", function () {
    var file = importFileInput.files && importFileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result));
        if (!parsed || !Array.isArray(parsed.categories)) throw new Error("formato non valido");
        if (confirm("Sostituire la lista attuale (per tutti) con quella importata?")) {
          state = parsed;
          persist();
          render();
        }
      } catch (err) {
        alert("File non valido.");
      }
      importFileInput.value = "";
    };
    reader.readAsText(file);
  });
})();
</script>
</body>
</html>
